# GoalGetter — serves the SPA and reverse-proxies /api to FastAPI.
#
# The point of this arrangement is that the browser sees ONE origin. That
# removes CORS entirely and lets session cookies use SameSite=Lax instead of
# None, which is both simpler and safer.
#
# Two listeners, one app (nginx/conf.d/app.inc):
#
#   :80  published as APP_PORT. Plain HTTP: everybody until HTTPS is on, and
#        TVs only after (P5-3).
#   :81  never published. Only the `https` container (Caddy) talks to it.
#
# Each one hands the API exactly one hop of X-Forwarded-For, so
# TRUSTED_PROXY_HOPS=1 is right for both (P5-2). It used to be one hop on the
# plain port and two through Caddy, and no single setting fitted both: every
# HTTPS visitor would have looked like the same address.

# Sends "Connection: upgrade" only when the client actually asked to upgrade,
# and "close" otherwise. Hardcoding "upgrade" on every request tells ordinary
# API calls to become WebSockets, which they are not.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The scheme on the plain port: our own, unless a proxy of the organization's
# own in front of it (hosting option F) says https. A client setting it itself
# can only mark its own cookie Secure.
map $http_x_forwarded_proto $plain_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# What a TV needs from the plain port once HTTPS is on (P5-3): its two pages,
# what they load, and nothing that takes a password. Everything else goes to
# the HTTPS address.
map $uri $gg_tv_path {
    default                       0;
    ~^/display/                   1;
    /pair                         1;
    ~^/assets/                    1;
    /healthz                      1;
    ~^/api/display/               1;
    ~^/api/displays/pair/         1;
    # Not /api/images/ (P6-3): it needs a session a TV never has. A wall's
    # pictures come through /api/display/{token}/assets/.
    # Asked on every page load by the app's frame, before the TV page draws.
    # Neither takes a password; a TV has no session, so "me" is a 401.
    /api/auth/me                  1;
    /api/setup/status             1;
    /api/health                   1;
    ~^/[^/]+\.(svg|png|ico|webmanifest|txt)$  1;
}

server {
    listen 80;
    server_name _;

    # `set $gg_https_address "https://goals.internal";`, or "" while HTTPS is
    # off — written by the app when HTTPS changes in Settings → Hosting, and
    # reloaded by docker/web-https.sh (Phase 20).
    include /etc/nginx/gg/https.conf;

    # **TVs only, once HTTPS is on** (P5-3). Over plain HTTP anybody on the
    # network can read a password, so the sign-in page — and every other page
    # but a TV's — moves to the HTTPS address.
    # 302, not 301 (P6-2): browsers keep a 301 for good, so turning HTTPS
    # off later would leave them going to an address that no longer answers.
    set $gg_plain_check "$gg_tv_path:$gg_https_address";
    if ($gg_plain_check ~ "^0:(https://.+)$") {
        return 302 $1$request_uri;
    }

    # Appends the peer: the API takes the last entry, so nothing a client
    # prepends is read. Behind a proxy of the organization's own (hosting
    # option F) TRUSTED_PROXY_HOPS=2 reads the entry that proxy added.
    set $gg_forwarded_for   $proxy_add_x_forwarded_for;
    set $gg_forwarded_proto $plain_forwarded_proto;

    include /etc/nginx/conf.d/app.inc;
}

server {
    # Caddy only. Its X-Forwarded-For already ends with the real visitor, so
    # it is passed on as it is — appending here would add Caddy, and make
    # every HTTPS visitor the same address (P5-2).
    listen 81;
    server_name _;

    set $gg_forwarded_for   $http_x_forwarded_for;
    set $gg_forwarded_proto https;

    include /etc/nginx/conf.d/app.inc;
}
