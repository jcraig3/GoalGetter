[alembic]
script_location = alembic
prepend_sys_path = .
# How to split the list above. Without it Alembic falls back to splitting on
# spaces, commas AND colons, which mangles any path containing one.
path_separator = os

# Timestamped, readable filenames. The default is a bare hash, which makes the
# versions/ folder impossible to skim.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# sqlalchemy.url is set in env.py from application settings, so the database
# password is never written into a committed file.

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
