# Development overlay — no image builds.
#
# Every service runs a stock base image with your source mounted in, so editing
# a file takes effect without rebuilding anything. Adding a dependency needs
# only a restart of that service, because dependencies install at container
# start rather than at image build.
#
# The cost is slower startup (~20–40s for the API, which pip-installs on boot).
# Production bakes everything into images instead — see docker-compose.prod.yml.

services:
  api:
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - ./api:/app
    ports:
      # Published in development only, for /docs and direct inspection.
      # Production reaches the API through nginx exclusively.
      - '8000:8000'
    # Installs deps, applies migrations, then serves with auto-reload.
    # Migrations run before uvicorn binds, so the API is never reachable
    # against a schema it doesn't expect.
    command: >
      sh -c "pip install --no-cache-dir -e '.[dev]' --quiet
      && alembic upgrade head
      && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Writes the HTTPS address for the plain port before nginx starts (P5-3).
      - ./docker/web-https.sh:/docker-entrypoint.d/40-goalgetter-https.sh:ro
      # Filled by the webbuild watcher below.
      - web-dist:/usr/share/nginx/html:ro

  # Rebuilds the SPA whenever a source file changes. Development only — this
  # service does not exist in production, where the build is baked into the
  # web image.
  webbuild:
    image: node:24-alpine
    working_dir: /app
    restart: unless-stopped
    environment:
      # Enables watch mode with polling — see the comment in vite.config.ts.
      BUILD_WATCH: 'true'
      # Output must live OUTSIDE the watched folder. Writing into ./dist makes
      # the watcher retrigger itself endlessly (measured at ~160 idle rebuilds
      # per 30 seconds).
      BUILD_OUT_DIR: /dist
    volumes:
      - ./web:/app
      # Anonymous volume so the container keeps its own Linux-built
      # node_modules instead of inheriting one built for Windows.
      - /app/node_modules
      - web-dist:/dist
    command: sh -c "npm install && npm run build"

volumes:
  # Shares the build output from webbuild to nginx. A named volume rather than
  # a bind mount because nothing on the host needs to read it — it is
  # regenerated on every build.
  web-dist:
